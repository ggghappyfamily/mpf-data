name: Update HSI PE Data

on:
  schedule:
    # 香港時間每日早上 8 點（UTC 00:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        run: python update_hsi_pe.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hsi_pe.csv hsi_pe_monthly.txt hsi_pe_weekly.txt pe_array_for_pine.txt latest_pe_override.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update HSI PE data $(date +%Y-%m-%d)"
            git push
          fi
